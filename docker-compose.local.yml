services:
  mongo:
    image: mongo:8.0
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - bookkeepers_local_mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ping:1})']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  bookkeepers_local_mongo:
