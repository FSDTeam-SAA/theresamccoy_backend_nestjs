services:
  app:
    image: ${DOCKER_IMAGE:-theresamccoy:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    container_name: ${APP_CONTAINER_NAME:-theresamccoy_api}

    restart: unless-stopped

    # Main env file. Ei file local-e .env hobe.
    env_file:
      - .env

    # Important runtime env. .env theke na pele default use korbe.
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8080}

    # Host:Container port mapping
    # Example: APP_PORT=5000 and PORT=5000 => localhost:5000
    ports:
      - "${APP_PORT:-8080}:${PORT:-8080}"

    networks:
      - backend_network

    # App healthy kina Docker check korbe
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 5000)).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# App and Mongo same private docker network-e thakbe
networks:
  backend_network:
    driver: bridge
